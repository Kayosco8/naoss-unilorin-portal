<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NAOSS Admin Dashboard</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #172033;
      line-height: 1.5;
    }

    header {
      background: #071a52;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    header h1 {
      font-size: 24px;
    }

    header p {
      font-size: 13px;
      opacity: 0.85;
    }

    button {
      border: none;
      border-radius: 7px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: #071a52;
      color: white;
    }

    .green {
      background: #0b5d3b;
      color: white;
    }

    .danger {
      background: #b42318;
      color: white;
    }

    .container {
      width: 94%;
      max-width: 1200px;
      margin: 30px auto;
    }

    .login-box {
      max-width: 450px;
      margin: 70px auto;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .login-box h2 {
      color: #071a52;
      margin-bottom: 8px;
    }

    .login-box p {
      color: #667085;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #d0d5dd;
      border-radius: 7px;
      font-size: 15px;
      background: white;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .message {
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 15px;
      display: none;
    }

    .error {
      display: block;
      background: #fef3f2;
      color: #b42318;
    }

    .success {
      display: block;
      background: #ecfdf3;
      color: #027a48;
    }

    #dashboard {
      display: none;
    }

    .welcome {
      background: white;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.05);
    }

    .welcome h2 {
      color: #071a52;
      margin-bottom: 5px;
    }

    .stats {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.05);
    }

    .stat h3 {
      font-size: 28px;
      color: #0b5d3b;
    }

    .section {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.05);
    }

    .section h2 {
      color: #071a52;
      margin-bottom: 20px;
      border-bottom: 1px solid #eaecf0;
      padding-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(240px, 1fr));
      gap: 15px;
    }

    .record {
      border: 1px solid #eaecf0;
      border-radius: 9px;
      padding: 16px;
      background: white;
    }

    .record h3 {
      color: #0b5d3b;
      margin-bottom: 7px;
    }

    .record p {
      margin-bottom: 5px;
      font-size: 14px;
    }

    .record img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      margin-bottom: 12px;
    }

    .actions {
      margin-top: 12px;
    }

    @media (max-width: 600px) {

      header {
        align-items: flex-start;
      }

      .section {
        padding: 18px;
      }

    }

  </style>

</head>

<body>


<header>

  <div>

    <h1>
      NAOSS Admin Dashboard
    </h1>

    <p>
      Digital Administrative Archive —
      University of Ilorin Chapter
    </p>

  </div>

  <button
    id="logoutBtn"
    class="danger"
  >
    Logout
  </button>

</header>


<div
  id="loginSection"
  class="container"
>

  <div class="login-box">

    <h2>
      Admin Login
    </h2>

    <p>
      Sign in to manage NAOSS
      administrative records.
    </p>

    <div
      id="loginMessage"
      class="message"
    ></div>

    <form id="loginForm">

      <div class="form-group">

        <label>
          Admin Email
        </label>

        <input
          type="email"
          id="loginEmail"
          placeholder="Enter admin email"
          required
        >

      </div>

      <div class="form-group">

        <label>
          Password
        </label>

        <input
          type="password"
          id="loginPassword"
          placeholder="Enter password"
          required
        >

      </div>

      <button
        type="submit"
        id="loginBtn"
        class="primary"
        style="width:100%;"
      >
        Login
      </button>

    </form>

  </div>

      </div>
